name: Actualizar datos del dashboard

on:
  push:
    branches: [main]
    paths:
      - "CONTROL_SUPLES.ods"
      - "Indicadores.ods"
      - "CARRERA_PREVISION.ods"
  schedule:
    # Cada día a las 06:00 UTC: refresca los eventos manuales de Google Calendar
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas odfpy google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Regenerar datos por defecto (SUPLE) desde CONTROL_SUPLES.ods
        run: python3 scripts/generate_data.py

      - name: Regenerar datos por defecto (Acción Social) desde Indicadores.ods
        run: python3 scripts/generate_accion_data.py

      - name: Regenerar datos por defecto (Carrera Profesional) desde CARRERA_PREVISION.ods
        run: python3 scripts/generate_carrera_data.py

      - name: Sincronizar SUPLES con Google Calendar
        if: always()
        continue-on-error: true
        env:
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python3 scripts/sync_google_calendar.py

      - name: Sincronizar Carrera Profesional con Google Calendar
        if: always()
        continue-on-error: true
        env:
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python3 scripts/sync_carrera_google_calendar.py

      - name: Exportar eventos manuales de Google Calendar (para la pestaña Calendario)
        if: always()
        continue-on-error: true
        env:
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python3 scripts/export_calendar_events.py

      - name: Commitear cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html calendar_events.json
          if git diff --cached --quiet; then
            echo "Sin cambios en index.html ni calendar_events.json, nada que commitear."
          else
            git commit -m "Actualiza datos del dashboard desde CONTROL_SUPLES.ods / Indicadores.ods / CARRERA_PREVISION.ods [skip ci]"
            git push
          fi

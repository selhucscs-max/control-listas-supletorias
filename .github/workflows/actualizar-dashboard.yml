name: Actualizar datos del dashboard

on:
  push:
    branches: [main]
    paths:
      - "CONTROL_SUPLES.ods"
      - "Indicadores.ods"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install pandas odfpy

      - name: Regenerar datos por defecto (SUPLE) desde CONTROL_SUPLES.ods
        run: python3 scripts/generate_data.py

      - name: Regenerar datos por defecto (Acción Social) desde Indicadores.ods
        run: python3 scripts/generate_accion_data.py

      - name: Commitear cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "index.html sin cambios, nada que commitear."
          else
            git add index.html
            git commit -m "Actualiza datos del dashboard desde CONTROL_SUPLES.ods / Indicadores.ods [skip ci]"
            git push
          fi
